name: ${PROJECT}
description: ${DESCRIPTION}
runtime: nodejs
template:
  description: A Pulumi program that deploys an Astro app with Cloudflare workers.
  config:
    accountID:
      description: Your Cloudflare account ID. See https://dash.cloudflare.com → Compute → Workers & Pages → Account details.
    subdomain:
      description: Your Cloudflare subdomain. Under Compute → Workers & Pages → Account details.
    cloudflare:apiToken:
      description: |
        Your Cloudflare API token. Under Manage Account → API Tokens. Needs Workers KV (Edit) and Workers Scripts (Edit). Skip to read $CLOUDFLARE_API_TOKEN instead.
