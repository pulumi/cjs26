name: ${PROJECT}
description: ${DESCRIPTION}
runtime: nodejs
template:
  description: A Pulumi program that deploys an Astro app with Cloudflare workers.
  config:
    accountID:
      description: Your Cloudflare account ID. See https://dash.cloudflare.com → Compute → Workers & Pages → Account details.
    subdomain:
      description: Your Cloudflare subdomain. See https://dash.cloudflare.com → Compute → Workers & Pages → Subdomain.
    cloudflare:apiToken:
      description: |
        Your Cloudflare API token. See https://dash.cloudflare.com → Manage Account → API Tokens. Requires Workers KV (Edit) and Workers Scripts (Edit). Omit to fall back to $CLOUDFLARE_API_TOKEN instead.
